<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HELB Tracker - Pesa Yangu</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans">
<div class="bg-[#004aad] text-white p-4 text-center">
<h2 class="font-bold text-xl">HELB Tracker</h2>
<p class="text-sm">Track HELB yako kama PRO</p>
</div>

<div class="max-w-2xl mx-auto p-4 space-y-4">
<div class="bg-white border-dashed border p-2 text-center text-sm">AdSense Top Banner</div>

<div class="bg-white rounded-2xl shadow-lg p-5 border">
<h2 class="font-bold text-lg">Track HELB Yako Kama PRO</h2>
<p class="text-sm text-slate-500 mb-4">Weka pesa uliyopewa na tuta-track</p>

<div class="grid grid-cols-2 gap-3">
<div><label class="text-xs font-bold">Jina</label><input id="name" class="w-full border rounded-lg p-2.5 mt-1" placeholder="Hassan"></div>
<div><label class="text-xs font-bold">HELB Total</label><input id="total" type="number" class="w-full border rounded-lg p-2.5 mt-1" placeholder="40000"></div>
</div>

<button onclick="setTotal()" class="w-full bg-black text-white p-3.5 rounded-xl font-bold mt-4">Anza Ku-track 🔥</button>
<div id="balance" class="text-center text-3xl font-black mt-4">KES 0</div>
<div id="daily" class="text-center bg-purple-100 p-2 rounded-lg text-sm mt-2"></div>
</div>

<div class="bg-white rounded-2xl shadow-lg p-5">
<h3 class="font-bold">💸 Ongeza Matumizi</h3>
<input id="cat" class="w-full border rounded-lg p-3 mt-2" placeholder="Mzinga, Fare, Chips">
<input id="amt" type="number" class="w-full border rounded-lg p-3 mt-2" placeholder="Kiasi">
<button onclick="addExp()" class="w-full bg-[#004aad] text-white p-3 rounded-xl font-bold mt-2">Ongeza</button>
<div id="list" class="mt-3"></div>
</div>

<button onclick="shareWA()" class="w-full bg-[#25D366] text-white p-3 rounded-xl font-bold">📤 Share WhatsApp</button>
</div>

<script>
let total=localStorage.getItem('h_total')?+localStorage.getItem('h_total'):0;
let exps=JSON.parse(localStorage.getItem('h_exps')||'[]');
function update(){let spent=exps.reduce((a,b)=>a+b.amt,0);let bal=total-spent;document.getElementById('balance').innerText='KES '+bal.toLocaleString();let days=new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate()-new Date().getDate();if(days<1)days=1;document.getElementById('daily').innerText='Daily Budget: KES '+Math.floor(bal/days)+' for '+days+' days';let h='';[...exps].reverse().forEach(e=>h+=`<div class="flex justify-between border-b py-2 text-sm"><span>${e.cat}</span><b>-${e.amt}</b></div>`);document.getElementById('list').innerHTML=h;localStorage.setItem('h_total',total);localStorage.setItem('h_exps',JSON.stringify(exps));}
function setTotal(){let t=+document.getElementById('total').value;if(!t)return alert('Weka total');total=t;update();}
function addExp(){let c=document.getElementById('cat').value,a=+document.getElementById('amt').value;if(!c||!a)return;exps.push({cat:c,amt:a});document.getElementById('cat').value='';document.getElementById('amt').value='';update();}
function shareWA(){let spent=exps.reduce((a,b)=>a+b.amt,0);let bal=total-spent;let txt=`🔥 HELB Tracker Report 🔥%0ATotal: ${total}%0ASpent: ${spent}%0ABalance: ${bal}%0ATrack kwa: https://${location.host}`;window.open('https://wa.me/?text='+txt,'_blank');}
update();
</script>
</body>
</html>
